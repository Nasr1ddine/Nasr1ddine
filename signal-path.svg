<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 270" width="930" height="270" role="img" aria-label="The signal path: Users, Gateway, LLM Router, Memory, RAG with a Vector DB sub-call, and an Agent Runtime that re-plans — bracketed by Observability, Evaluation and Deployment.">
  <defs>
    <linearGradient id="spineGrad" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="918" y2="0">
      <stop offset="0" stop-color="#a8813b"/>
      <stop offset="0.5" stop-color="#e6cd8b"/>
      <stop offset="1" stop-color="#a8813b"/>
    </linearGradient>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <marker id="tip" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#c9a24e" fill-opacity="0.55"/>
    </marker>
  </defs>

  <style>
    text { font-family: "Segoe UI", Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, "Liberation Mono", Menlo, monospace; }

    .spine { stroke-dasharray: 898; stroke-dashoffset: 898; animation: drawSpine 1.5s .2s cubic-bezier(.65,0,.35,1) forwards; }
    @keyframes drawSpine { to { stroke-dashoffset: 0; } }

    .node { opacity: 0; transform: translateY(10px); animation: rise .7s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    .k1 { animation-delay: .35s } .k2 { animation-delay: .5s } .k3 { animation-delay: .65s }
    .k4 { animation-delay: .8s } .k5 { animation-delay: .95s } .k6 { animation-delay: 1.1s }

    /* border lights as the pulse passes through — one 5.4s cycle, phase-matched */
    .lit { stroke: #e6cd8b; stroke-opacity: 0; animation: flash 5.4s linear infinite; }
    @keyframes flash { 0% { stroke-opacity: 0 } 3% { stroke-opacity: .85 } 13% { stroke-opacity: 0 } 100% { stroke-opacity: 0 } }
    .f1 { animation-delay: 2.19s } .f2 { animation-delay: 3.11s } .f3 { animation-delay: 4.04s }
    .f4 { animation-delay: 4.96s } .f5 { animation-delay: 5.89s } .f6 { animation-delay: 6.82s }

    .late { opacity: 0; animation: fadeIn .8s forwards; }
    @keyframes fadeIn { to { opacity: 1 } }
    .l1 { animation-delay: 1.25s } .l2 { animation-delay: 1.4s } .l3 { animation-delay: 1.55s }

    .march { stroke-dasharray: 3 6; animation: march 2.6s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -18; } }

    .beat { animation: beat 2.6s ease-in-out infinite; }
    .b2 { animation-delay: .45s } .b3 { animation-delay: .9s }
    @keyframes beat { 0%,100% { opacity: 1 } 50% { opacity: .3 } }

    @media (prefers-reduced-motion: reduce) {
      .spine { stroke-dashoffset: 0; animation: none }
      .node, .late { opacity: 1; transform: none; animation: none }
      .lit, .march, .beat { animation: none }
    }
  </style>

  <rect x="0.5" y="0.5" width="929" height="269" rx="16" fill="#0b0a09" stroke="#f3efe6" stroke-opacity="0.09"/>

  <text class="mono" x="20" y="26" font-size="9.5" letter-spacing="2.6" fill="#726a5c">THE SIGNAL PATH — ONE REQUEST THROUGH A PRODUCTION AI SYSTEM</text>

  <!-- phase bands -->
  <g class="mono" font-size="8.5" letter-spacing="2.2" fill="#55503f">
    <text class="late l1" x="20" y="48">INGRESS</text>
    <text class="late l1" x="328" y="48">MODEL LAYER</text>
    <text class="late l2" x="636" y="48">RETRIEVAL</text>
    <text class="late l2" x="790" y="48">EXECUTION</text>
  </g>

  <!-- spine + travelling pulse (drawn under the nodes: the signal enters each hop) -->
  <path class="spine" d="M20 90 H918" stroke="url(#spineGrad)" stroke-width="1.4" fill="none"/>
  <g class="late l2" fill="#c9a24e" fill-opacity="0.55">
    <path d="M158 86.5 L164 90 L158 93.5 Z"/>
    <path d="M312 86.5 L318 90 L312 93.5 Z"/>
    <path d="M466 86.5 L472 90 L466 93.5 Z"/>
    <path d="M620 86.5 L626 90 L620 93.5 Z"/>
    <path d="M774 86.5 L780 90 L774 93.5 Z"/>
  </g>
  <g class="late l3">
    <circle r="8" fill="#c9a24e" opacity="0.28" filter="url(#glow)">
      <animateMotion dur="5.4s" begin="1.8s" repeatCount="indefinite" path="M20 90 H918"/>
    </circle>
    <circle r="3.4" fill="#f6e6bd">
      <animateMotion dur="5.4s" begin="1.8s" repeatCount="indefinite" path="M20 90 H918"/>
    </circle>
  </g>

  <!-- hops -->
  <g class="node k1">
    <rect x="20" y="58" width="128" height="64" rx="10" fill="#131110" stroke="#f3efe6" stroke-opacity="0.09"/>
    <rect class="lit f1" x="20" y="58" width="128" height="64" rx="10" fill="none"/>
    <text x="84" y="80" font-size="13" font-weight="600" fill="#f3efe6" text-anchor="middle">Users</text>
    <text class="mono" x="84" y="96" font-size="9.5" fill="#726a5c" text-anchor="middle">intent arrives</text>
    <text class="mono" x="84" y="112" font-size="9" fill="#c9a24e" fill-opacity="0.8" text-anchor="middle">p95 ≤ 1.2 s</text>
  </g>
  <g class="node k2">
    <rect x="174" y="58" width="128" height="64" rx="10" fill="#131110" stroke="#f3efe6" stroke-opacity="0.09"/>
    <rect class="lit f2" x="174" y="58" width="128" height="64" rx="10" fill="none"/>
    <text x="238" y="80" font-size="13" font-weight="600" fill="#f3efe6" text-anchor="middle">Gateway</text>
    <text class="mono" x="238" y="96" font-size="9.5" fill="#726a5c" text-anchor="middle">auth · budgets</text>
    <text class="mono" x="238" y="112" font-size="9" fill="#c9a24e" fill-opacity="0.8" text-anchor="middle">≤ 8 ms · 60 rpm</text>
  </g>
  <g class="node k3">
    <rect x="328" y="58" width="128" height="64" rx="10" fill="#131110" stroke="#f3efe6" stroke-opacity="0.09"/>
    <rect class="lit f3" x="328" y="58" width="128" height="64" rx="10" fill="none"/>
    <text x="392" y="80" font-size="13" font-weight="600" fill="#f3efe6" text-anchor="middle">LLM Router</text>
    <text class="mono" x="392" y="96" font-size="9.5" fill="#726a5c" text-anchor="middle">model per task</text>
    <text class="mono" x="392" y="112" font-size="9" fill="#c9a24e" fill-opacity="0.8" text-anchor="middle">≤ 15 ms · 0 tokens</text>
  </g>
  <g class="node k4">
    <rect x="482" y="58" width="128" height="64" rx="10" fill="#131110" stroke="#f3efe6" stroke-opacity="0.09"/>
    <rect class="lit f4" x="482" y="58" width="128" height="64" rx="10" fill="none"/>
    <text x="546" y="80" font-size="13" font-weight="600" fill="#f3efe6" text-anchor="middle">Memory</text>
    <text class="mono" x="546" y="96" font-size="9.5" fill="#726a5c" text-anchor="middle">state across turns</text>
    <text class="mono" x="546" y="112" font-size="9" fill="#c9a24e" fill-opacity="0.8" text-anchor="middle">≤ 25 ms read</text>
  </g>
  <g class="node k5">
    <rect x="636" y="58" width="128" height="64" rx="10" fill="#131110" stroke="#f3efe6" stroke-opacity="0.09"/>
    <rect class="lit f5" x="636" y="58" width="128" height="64" rx="10" fill="none"/>
    <text x="700" y="80" font-size="13" font-weight="600" fill="#f3efe6" text-anchor="middle">RAG</text>
    <text class="mono" x="700" y="96" font-size="9.5" fill="#726a5c" text-anchor="middle">retrieve · rerank</text>
    <text class="mono" x="700" y="112" font-size="9" fill="#c9a24e" fill-opacity="0.8" text-anchor="middle">≤ 320 ms</text>
  </g>
  <g class="node k6">
    <rect x="790" y="58" width="128" height="64" rx="10" fill="#131110" stroke="#f3efe6" stroke-opacity="0.09"/>
    <rect class="lit f6" x="790" y="58" width="128" height="64" rx="10" fill="none"/>
    <text x="854" y="80" font-size="13" font-weight="600" fill="#f3efe6" text-anchor="middle">Agent Runtime</text>
    <text class="mono" x="854" y="96" font-size="9.5" fill="#726a5c" text-anchor="middle">plan · act · grade</text>
    <text class="mono" x="854" y="112" font-size="9" fill="#c9a24e" fill-opacity="0.8" text-anchor="middle">≤ 3 hops · 2 retries</text>
  </g>

  <!-- re-plan loop -->
  <g class="late l3">
    <path d="M900 58 C900 26 808 26 808 56" stroke="#c9a24e" stroke-opacity="0.45" stroke-width="1.1" fill="none" marker-end="url(#tip)"/>
    <text class="mono" x="854" y="21" font-size="8" letter-spacing="1.4" fill="#726a5c" text-anchor="middle">RE-PLAN</text>
    <circle r="2.2" fill="#f6e6bd">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M900 58 C900 26 808 26 808 56"/>
    </circle>
  </g>

  <!-- vector db sub-call -->
  <g class="late l3">
    <path class="march" d="M700 122 V146" stroke="#c9a24e" stroke-opacity="0.5" stroke-width="1.1" fill="none"/>
    <rect x="636" y="146" width="128" height="34" rx="8" fill="#131110" stroke="#c9a24e" stroke-opacity="0.22"/>
    <text x="700" y="161" font-size="11" font-weight="600" fill="#a79f90" text-anchor="middle">Vector DB</text>
    <text class="mono" x="700" y="173" font-size="8.5" fill="#c9a24e" fill-opacity="0.75" text-anchor="middle">p95 ≤ 40 ms</text>
    <text class="mono" x="774" y="166" font-size="8" letter-spacing="1.2" fill="#55503f">SUB-CALL</text>
    <text class="mono" x="20" y="152" font-size="9" letter-spacing="1.6" fill="#55503f">BUDGETS ARE DESIGN CONSTRAINTS, NOT MEASURED RESULTS —</text>
    <text class="mono" x="20" y="170" font-size="9" letter-spacing="1.6" fill="#55503f">THE NUMBERS A ROUTE IS ALLOWED TO SPEND.</text>
  </g>

  <!-- operations rail -->
  <g class="late l3">
    <text class="mono" x="20" y="200" font-size="9" letter-spacing="2.6" fill="#726a5c">OPERATIONS</text>
    <text class="mono" x="910" y="200" font-size="8.5" letter-spacing="1.2" fill="#55503f" text-anchor="end">CROSS-CUTTING — SPANS EVERY HOP</text>
    <path class="march" d="M20 208 H910" stroke="#f3efe6" stroke-opacity="0.14" stroke-width="1" fill="none"/>

    <rect x="20" y="218" width="286" height="30" rx="8" fill="#131110" stroke="#f3efe6" stroke-opacity="0.07"/>
    <circle class="beat" cx="36" cy="233" r="2.6" fill="#3aa370"/>
    <text x="48" y="237" font-size="11" font-weight="600" fill="#f3efe6">Observability</text>
    <text class="mono" x="292" y="237" font-size="9" fill="#726a5c" text-anchor="end">100 % traced · ≤ 2 % overhead</text>

    <rect x="322" y="218" width="286" height="30" rx="8" fill="#131110" stroke="#f3efe6" stroke-opacity="0.07"/>
    <circle class="beat b2" cx="338" cy="233" r="2.6" fill="#3aa370"/>
    <text x="350" y="237" font-size="11" font-weight="600" fill="#f3efe6">Evaluation</text>
    <text class="mono" x="594" y="237" font-size="9" fill="#726a5c" text-anchor="end">faithfulness ≥ 0.90 to ship</text>

    <rect x="624" y="218" width="286" height="30" rx="8" fill="#131110" stroke="#f3efe6" stroke-opacity="0.07"/>
    <circle class="beat b3" cx="640" cy="233" r="2.6" fill="#3aa370"/>
    <text x="652" y="237" font-size="11" font-weight="600" fill="#f3efe6">Deployment</text>
    <text class="mono" x="896" y="237" font-size="9" fill="#726a5c" text-anchor="end">cold start ≤ 900 ms</text>
  </g>
</svg>
